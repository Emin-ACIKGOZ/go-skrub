# .golangci.yml - Standardized Go Linter Configuration
# golangci-lint v2 compatible
version: "2"

run:
  timeout: 5m
  tests: true

output:
  print-issued-lines: true
  print-linter-name: true

linters:
  default: none
  enable:
    # --- Core & Bugs ---
    - bodyclose
    - copyloopvar
    - errcheck
    - govet
    - nilerr
    - noctx
    - reassign
    - staticcheck
    - unused

    # --- Style, Performance & Idioms ---
    - goconst
    - ineffassign
    - misspell
    - mnd
    - perfsprint
    - predeclared
    - revive
    - whitespace

    # --- Complexity & Meta ---
    - cyclop
    - nolintlint

    # --- Security ---
    - gosec

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - goconst
        - perfsprint
    - path: internal/tagparser/.*
      linters:
        - goconst